<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#04091a"/>
      <stop offset="50%"  stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#020810"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#38bdf8"/>
      <stop offset="45%"  stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="glow-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow-r" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#c084fc" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wave-a" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#38bdf8" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wave-b" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#818cf8" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pill-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="rgba(56,189,248,0.12)"/>
      <stop offset="100%" stop-color="rgba(192,132,252,0.12)"/>
    </linearGradient>
    <linearGradient id="topbar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="rgba(56,189,248,0)"/>
      <stop offset="30%"  stop-color="rgba(56,189,248,0.7)"/>
      <stop offset="70%"  stop-color="rgba(192,132,252,0.7)"/>
      <stop offset="100%" stop-color="rgba(192,132,252,0)"/>
    </linearGradient>
    <!-- XP bar gradient -->
    <linearGradient id="xp-fill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(148,163,184,0.055)"/>
    </pattern>
    <filter id="gblur">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
  </defs>

  <style>
    .name  { font: 800 52px/1 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; fill:#f8fafc; letter-spacing:-1px; }
    .pill  { font: 600 12px/1 ui-monospace,'Fira Code',monospace; fill:#38bdf8; letter-spacing:2.5px; text-transform:uppercase; }
    .sub   { font: 400 18px/1 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; fill:#94a3b8; letter-spacing:.4px; }
    .tag   { font: 500 12px/1 ui-monospace,'Fira Code',monospace; fill:#475569; }
    .sep   { fill:#6366f1; font-size:18px; font-weight:800; }
    .lbl   { font: 600 11px/1 ui-monospace,'Fira Code',monospace; fill:#64748b; letter-spacing:1.5px; text-transform:uppercase; }
    .val   { font: 700 13px/1 ui-monospace,'Fira Code',monospace; fill:#38bdf8; }
  </style>

  <!-- Base layers -->
  <rect width="1200" height="360" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="20" fill="url(#dots)"/>

  <!-- Glow orbs -->
  <ellipse cx="160"  cy="90"  rx="210" ry="155" fill="#38bdf8" opacity="0.09" filter="url(#gblur)"/>
  <ellipse cx="1060" cy="270" rx="230" ry="160" fill="#c084fc" opacity="0.09" filter="url(#gblur)"/>

  <!-- Waves -->
  <path d="M0,268 C220,224 440,295 700,248 C880,215 1060,278 1200,245L1200,360L0,360Z" fill="url(#wave-a)"/>
  <path d="M0,292 C230,258 460,318 715,272 C900,242 1090,310 1200,278L1200,360L0,360Z" fill="url(#wave-b)"/>

  <!-- Accent bars -->
  <rect x="0" y="0"   width="1200" height="3.5" rx="2" fill="url(#topbar)"/>
  <rect x="0" y="356.5" width="1200" height="3.5" rx="2" fill="url(#accent)"/>

  <!-- Corner brackets -->
  <path d="M30,30 L30,58 M30,30 L58,30"   stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.5"/>
  <path d="M1170,30 L1170,58 M1170,30 L1142,30" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.5"/>
  <path d="M30,330 L30,302 M30,330 L58,330"   stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.5"/>
  <path d="M1170,330 L1170,302 M1170,330 L1142,330" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.5"/>

  <!-- ══ Main content (left cluster) ══ -->
  <g transform="translate(600,56)" text-anchor="middle">

    <!-- Role pill -->
    <rect x="-180" y="0" width="360" height="30" rx="15" fill="url(#pill-bg)" stroke="url(#topbar)" stroke-width="1"/>
    <circle cx="-155" cy="15" r="4" fill="#38bdf8" opacity="0.9"/>
    <text x="0" y="19.5" class="pill">⚡  AI Engineer · LLMs · Full-Stack</text>

    <!-- Name -->
    <text x="0" y="102" class="name">Prashant Kumar Sharma</text>

    <!-- Gradient rule -->
    <rect x="-145" y="118" width="290" height="3.5" rx="2" fill="url(#accent)"/>

    <!-- Subtitle -->
    <text y="158" class="sub">
      <tspan x="0">Software Engineer</tspan>
      <tspan dx="10" class="sep">·</tspan>
      <tspan dx="10">RAG &amp; LLM Systems</tspan>
      <tspan dx="10" class="sep">·</tspan>
      <tspan dx="10">Open Source</tspan>
    </text>

    <!-- Code tagline -->
    <text x="0" y="193" class="tag">&lt; turning complex ideas into production-grade intelligent systems /&gt;</text>

  </g>

  <!-- ══ XP / Level card (bottom right) ══ -->
  <g transform="translate(888, 248)">
    <rect width="270" height="82" rx="12" fill="rgba(15,23,42,0.75)" stroke="rgba(56,189,248,0.2)" stroke-width="1"/>
    <text x="14" y="20" class="lbl">🎮 Player Stats</text>
    <text x="14" y="40" class="lbl">LVL</text>
    <text x="46" y="40" class="val">42</text>
    <text x="90" y="40" class="lbl">CLASS</text>
    <text x="135" y="40" class="val">AI Architect</text>
    <text x="14" y="56" class="lbl">XP</text>
    <!-- XP bar track -->
    <rect x="36" y="47" width="210" height="8" rx="4" fill="rgba(56,189,248,0.12)"/>
    <!-- XP bar fill (78%) -->
    <rect x="36" y="47" width="163" height="8" rx="4" fill="url(#xp-fill)"/>
    <text x="253" y="56" text-anchor="end" class="lbl">78%</text>
    <text x="14" y="72" class="lbl">🔥 Streak</text>
    <text x="68" y="72" class="val">∞</text>
    <text x="110" y="72" class="lbl">⭐ Commits</text>
    <text x="182" y="72" class="val">1000+</text>
  </g>

</svg>
