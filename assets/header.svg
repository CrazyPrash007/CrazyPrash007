<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#050d1a"/>
      <stop offset="50%"  stop-color="#0d1b2e"/>
      <stop offset="100%" stop-color="#020812"/>
    </linearGradient>

    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#38bdf8"/>
      <stop offset="45%"  stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="glow2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#c084fc" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="wave1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="wave2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#818cf8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>

    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="rgba(148,163,184,0.06)"/>
    </pattern>

    <filter id="blur1">
      <feGaussianBlur stdDeviation="40"/>
    </filter>

    <linearGradient id="topBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="rgba(56,189,248,0)"/>
      <stop offset="30%"  stop-color="rgba(56,189,248,0.6)"/>
      <stop offset="70%"  stop-color="rgba(192,132,252,0.6)"/>
      <stop offset="100%" stop-color="rgba(192,132,252,0)"/>
    </linearGradient>
  </defs>

  <style>
    .name {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 800;
      font-size: 54px;
      fill: #f8fafc;
      letter-spacing: -1px;
    }
    .role-pill-text {
      font-family: ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, monospace;
      font-size: 13px;
      font-weight: 600;
      fill: #38bdf8;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .sub {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 19px;
      font-weight: 400;
      fill: #94a3b8;
      letter-spacing: 0.4px;
    }
    .code-tag {
      font-family: ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, monospace;
      font-size: 13px;
      font-weight: 500;
      fill: #475569;
    }
    .dot-sep {
      font-size: 18px;
      fill: #6366f1;
      font-weight: 800;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="340" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="20" fill="url(#dots)"/>

  <!-- Ambient glow circles (blurred) -->
  <ellipse cx="180"  cy="80"  rx="200" ry="150" fill="#38bdf8" opacity="0.09" filter="url(#blur1)"/>
  <ellipse cx="1050" cy="260" rx="220" ry="160" fill="#c084fc" opacity="0.09" filter="url(#blur1)"/>

  <!-- Flowing bottom waves -->
  <path d="M 0,250 C 200,210 400,280 650,235 C 850,200 1050,265 1200,230 L1200,340 L0,340 Z" fill="url(#wave1)"/>
  <path d="M 0,275 C 220,245 420,295 680,260 C 880,230 1080,295 1200,265 L1200,340 L0,340 Z" fill="url(#wave2)"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="3" rx="1.5" fill="url(#topBorder)"/>
  <!-- Bottom accent bar -->
  <rect x="0" y="337" width="1200" height="3" rx="1.5" fill="url(#accent)"/>

  <!-- Decorative corner brackets -->
  <path d="M 28,28 L 28,54 M 28,28 L 54,28" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.5"/>
  <path d="M 1172,28 L 1172,54 M 1172,28 L 1146,28" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.5"/>
  <path d="M 28,312 L 28,286 M 28,312 L 54,312" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.5"/>
  <path d="M 1172,312 L 1172,286 M 1172,312 L 1146,312" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.5"/>

  <!-- Center group -->
  <g transform="translate(600, 60)" text-anchor="middle">

    <!-- Top badge pill -->
    <rect x="-155" y="0" width="310" height="32" rx="16" fill="rgba(56,189,248,0.07)" stroke="rgba(56,189,248,0.25)" stroke-width="1"/>
    <!-- Pill glow dot -->
    <circle cx="-130" cy="16" r="4" fill="#38bdf8" opacity="0.9"/>
    <text x="0" y="21" class="role-pill-text">⚡ AI · LLMs · Full-Stack</text>

    <!-- Main name -->
    <text x="0" y="102" class="name">Prashant Kumar Sharma</text>

    <!-- Gradient underline -->
    <rect x="-130" y="116" width="260" height="3.5" rx="2" fill="url(#accent)"/>

    <!-- Subtitle row -->
    <text x="0" y="158" class="sub">
      <tspan>Software Engineer</tspan>
      <tspan dx="12" class="dot-sep">·</tspan>
      <tspan dx="12">Transformer Architectures</tspan>
      <tspan dx="12" class="dot-sep">·</tspan>
      <tspan dx="12">Open Source</tspan>
    </text>

    <!-- Code tagline -->
    <text x="0" y="195" class="code-tag">&lt; transforming complex ideas into elegant systems /&gt;</text>

  </g>
</svg>
