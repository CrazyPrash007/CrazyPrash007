<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="45%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.03" />
    </linearGradient>

    <linearGradient id="waveGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.02" />
    </linearGradient>

    <!-- Subtle Tech Grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.035)" stroke-width="1" />
    </pattern>

    <!-- Accent Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.4)" />
      <stop offset="50%" stop-color="rgba(129, 140, 248, 0.2)" />
      <stop offset="100%" stop-color="rgba(192, 132, 252, 0.4)" />
    </linearGradient>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 800;
      font-size: 52px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .badge-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 14px;
      font-weight: 600;
      fill: #38bdf8;
      letter-spacing: 2.5px;
      text-transform: uppercase;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 21px;
      font-weight: 400;
      fill: #94a3b8;
      letter-spacing: 0.3px;
    }
    .tagline {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 14px;
      font-weight: 500;
      fill: #64748b;
    }
  </style>

  <!-- Card Background -->
  <rect width="1200" height="320" rx="18" fill="url(#bgGradient)" stroke="url(#borderGrad)" stroke-width="1.5" />
  <rect width="1200" height="320" rx="18" fill="url(#grid)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="150" cy="50" r="160" fill="#38bdf8" opacity="0.08" />
  <circle cx="1050" cy="220" r="180" fill="#818cf8" opacity="0.09" />

  <!-- Flowing Waves -->
  <path d="M 0,225 C 280,165 520,285 820,215 C 1000,175 1110,250 1200,210 L 1200,320 L 0,320 Z" fill="url(#waveGrad1)" />
  <path d="M 0,260 C 260,215 480,305 770,240 C 970,195 1090,275 1200,255 L 1200,320 L 0,320 Z" fill="url(#waveGrad2)" />

  <!-- Bottom Accent Gradient Line -->
  <rect x="0" y="316" width="1200" height="4" rx="2" fill="url(#primaryGrad)" />

  <!-- Center Content -->
  <g transform="translate(600, 85)" text-anchor="middle">
    <!-- Top Pill Badge -->
    <rect x="-185" y="-38" width="370" height="34" rx="17" fill="rgba(56, 189, 248, 0.08)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.2" />
    <text x="0" y="-16" text-anchor="middle" class="badge-text">⚡ AI &amp; Software Engineering</text>

    <!-- Main Title -->
    <text x="0" y="60" class="title">Prashant Kumar Sharma</text>

    <!-- Gradient Divider Bar -->
    <rect x="-100" y="88" width="200" height="3" rx="1.5" fill="url(#primaryGrad)" />

    <!-- Subtitle -->
    <text x="0" y="132" class="subtitle">Software Engineer • Large Language Models • Scalable Web Systems</text>

    <!-- Code glyphs / tagline -->
    <text x="0" y="165" class="tagline">&lt; building intelligent systems &amp; elegant code /&gt;</text>
  </g>
</svg>
